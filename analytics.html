<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraTern CAPI — Analytics</title>
<link rel="icon" href="https://terratern.com/images/favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #eaf2fc;
    --surface: #ffffff;
    --surface-deep: #dfeaf9;
    --border: #d6e3f5;
    --text: #0a0a0a;
    --text-muted: #5b6b80;
    --text-dim: #8da3bc;
    --accent: #255cc1;
    --accent-glow: rgba(37,92,193,0.10);
    --navy: #00215c;
    --sky: #2f7fd4;
    --gold: #b8930a;
    --green: #16a34a;
    --red: #dc2626;
    --red-bg: rgba(220,38,38,0.08);
    --mono: 'JetBrains Mono', monospace;
    --shadow: 0 1px 3px rgba(0,33,92,0.08), 0 1px 2px rgba(0,33,92,0.05);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── Header ── */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--surface);
    box-shadow: var(--shadow);
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .logo-img { height: 26px; width: auto; }

  .logo-dot {
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--gold);
    animation: pulse 2s infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .logo-text { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; }
  .logo-sub  { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

  .header-right { display: flex; align-items: center; gap: 8px; }

  .nav-link {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.15s;
  }

  .nav-link:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Trigger Button ── */
  .trigger-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }

  .trigger-btn:hover { background: var(--navy); }
  .trigger-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .trigger-btn.running { background: var(--gold); color: #000; }

  .trigger-status {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--text-muted);
    min-width: 120px;
    text-align: right;
  }

  /* ── Layout ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Date Range ── */
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }

  /* ── Date Picker ── */
  .date-picker-wrap { position: relative; }

  .date-picker-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12px;
    font-family: var(--mono);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    min-width: 130px;
    justify-content: space-between;
  }

  .date-picker-btn:hover, .date-picker-btn.open {
    border-color: var(--accent);
    color: var(--accent);
  }

  .dp-arrow { font-size: 10px; opacity: 0.6; }

  .date-picker-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,33,92,0.12);
    z-index: 200;
    min-width: 180px;
    overflow: hidden;
  }

  .dp-presets { display: flex; flex-direction: column; padding: 6px; gap: 2px; }

  .dp-preset {
    padding: 7px 12px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    text-align: left;
    border-radius: 6px;
    transition: all 0.1s;
    font-weight: 500;
  }

  .dp-preset:hover { background: var(--bg); color: var(--text); }
  .dp-preset.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }



  /* ── Funnel ── */
  .funnel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }

  .funnel-svg-wrap {
    display: flex;
    align-items: stretch;
    gap: 0;
    justify-content: center;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
  }

  .funnel-svg { flex: 0 0 320px; }

  .funnel-labels {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding: 12px 0;
    flex: 1;
    min-width: 200px;
  }

  .funnel-label-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .funnel-label-line {
    width: 32px;
    height: 1px;
    background: var(--border-light);
    flex-shrink: 0;
  }

  .funnel-label-content {}

  .funnel-label-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .funnel-label-count {
    font-size: 22px;
    font-weight: 700;
    font-family: var(--mono);
    color: var(--navy);
    line-height: 1.1;
  }

  .funnel-label-conv {
    font-size: 11px;
    font-family: var(--mono);
    margin-top: 1px;
  }

  .funnel-label-conv.good  { color: var(--green); }
  .funnel-label-conv.warn  { color: var(--gold); }
  .funnel-label-conv.bad   { color: var(--red); }

  /* ── Trend Chart ── */
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }

  .chart-wrap {
    position: relative;
    height: 320px;
  }

  .chart-legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
  }

  /* ── Loading / Empty ── */
  .loading-msg {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    transform: translateY(60px);
    opacity: 0;
    transition: all 0.25s;
    z-index: 999;
    color: #fff;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--green); }
  .toast.error   { background: var(--red); }
  .toast.info    { background: var(--accent); }

  @media (max-width: 768px) {
    .container { padding: 16px; }
    .funnel-stage { grid-template-columns: 120px 1fr 60px 60px; }
    .chart-wrap { height: 220px; }
    .header { padding: 0 16px; }
  }

  .cal-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,33,92,0.18);
    display: flex;
    overflow: hidden;
    min-width: 660px;
    max-width: 95vw;
    font-family: "Inter", sans-serif;
  }

  .cal-presets {
    width: 160px;
    border-right: 1px solid var(--border);
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--surface);
  }

  .cal-preset-btn {
    padding: 8px 12px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-family: "Inter", sans-serif;
    cursor: pointer;
    text-align: left;
    border-radius: 6px;
    transition: all 0.1s;
    font-weight: 500;
  }

  .cal-preset-btn:hover { background: var(--bg); color: var(--text); }
  .cal-preset-btn.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }

  .cal-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }

  .cal-months {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
  }

  .cal-month {
    flex: 1;
    min-width: 200px;
  }

  .cal-month-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .cal-month-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
  }

  .cal-nav {
    width: 26px;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: all 0.1s;
  }

  .cal-nav:hover { border-color: var(--accent); color: var(--accent); }
  .cal-nav.invisible { visibility: hidden; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .cal-dow {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    text-align: center;
    padding: 4px 0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .cal-day {
    font-size: 12px;
    text-align: center;
    padding: 6px 4px;
    border-radius: 5px;
    cursor: pointer;
    color: var(--text);
    transition: all 0.1s;
    font-weight: 500;
    border: 1px solid transparent;
  }

  .cal-day:hover:not(.cal-empty):not(.cal-disabled) {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent);
  }

  .cal-day.cal-empty { cursor: default; }
  .cal-day.cal-disabled { color: var(--text-dim); cursor: default; }

  .cal-day.cal-selected-start,
  .cal-day.cal-selected-end {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    border-color: var(--accent);
  }

  .cal-day.cal-in-range {
    background: var(--accent-glow);
    color: var(--accent);
    border-radius: 0;
  }

  .cal-day.cal-today {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }

  .cal-day.cal-today.cal-selected-start,
  .cal-day.cal-today.cal-selected-end {
    color: #fff;
  }

  .cal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 4px;
  }

  .cal-range-label {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent);
    font-weight: 600;
  }

  .cal-btns { display: flex; gap: 8px; }

  .cal-btn {
    padding: 6px 18px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: "Inter", sans-serif;
    transition: all 0.15s;
  }

  .cal-btn-cancel {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
  }

  .cal-btn-cancel:hover { border-color: var(--red); color: var(--red); }

  .cal-btn-apply {
    border: none;
    background: var(--accent);
    color: #fff;
  }

  .cal-btn-apply:hover { background: var(--navy); }
  .cal-btn-apply:disabled { opacity: 0.4; cursor: not-allowed; }

  @media (max-width: 680px) {
    .cal-box { flex-direction: column; min-width: unset; width: 95vw; }
    .cal-presets { width: 100%; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border); }
    .cal-months { flex-direction: column; gap: 16px; }
  }


  /* ── Custom Range Picker ── */
  .custom-picker-overlay {
    position: fixed;
    inset: 0;
    z-index: 400;
    background: rgba(0,33,92,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .custom-picker-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,33,92,0.18);
    padding: 28px;
    width: 380px;
    max-width: 95vw;
    font-family: 'Inter', sans-serif;
  }

  .custom-picker-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 20px;
  }

  .custom-picker-fields {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 20px;
  }

  .custom-picker-field {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .custom-picker-field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    width: 36px;
    flex-shrink: 0;
  }

  .custom-picker-field input[type="date"] {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-family: var(--mono);
    outline: none;
    transition: border-color 0.15s;
    cursor: pointer;
  }

  .custom-picker-field input[type="date"]:focus {
    border-color: var(--accent);
    background: var(--surface);
  }

  .custom-picker-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  .cp-btn {
    padding: 7px 20px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }

  .cp-btn-cancel {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
  }

  .cp-btn-cancel:hover { border-color: var(--red); color: var(--red); }

  .cp-btn-apply {
    border: none;
    background: var(--accent);
    color: #fff;
  }

  .cp-btn-apply:hover { background: var(--navy); }
  .cp-btn-apply:disabled { opacity: 0.4; cursor: not-allowed; }

</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="https://terratern.com/images/logo.svg" alt="TerraTern" class="logo-img">
    <div class="logo-dot"></div>
    <div>
      <div class="logo-text">CAPI · Analytics</div>
      <div class="logo-sub">Funnel &amp; Trends</div>
    </div>
  </div>
  <div class="header-right">
    <span class="trigger-status" id="triggerStatus"></span>
    <button class="trigger-btn" id="triggerBtn" onclick="manualTrigger()">
      ▶ Run Pipeline Now
    </button>
    <a class="nav-link" href="index.html">← Event Logs</a>
  </div>
</div>

<div class="container">

  <!-- Date picker -->
  <div class="controls">
    <div class="date-picker-wrap" id="datePickerWrap">
      <button class="date-picker-btn" id="datePickerBtn" onclick="toggleDatePicker(event)">
        <span id="datePickerLabel">Last 7 Days</span>
        <span class="dp-arrow">▾</span>
      </button>
      <div class="date-picker-dropdown" id="datePickerDropdown" style="display:none;">
        <div class="dp-presets">
          <button class="dp-preset" onclick="setPreset('7d',this)">Last 7 Days</button>
          <button class="dp-preset" onclick="setPreset('14d',this)">Last 14 Days</button>
          <button class="dp-preset" onclick="setPreset('30d',this)">Last 30 Days</button>
          <button class="dp-preset" onclick="setPreset('thisMonth',this)">This Month</button>
          <button class="dp-preset" onclick="setPreset('lastMonth',this)">Last Month</button>
          <button class="dp-preset" onclick="setPreset('60d',this)">Last 60 Days</button>
          <button class="dp-preset" onclick="setPreset('90d',this)">Last 90 Days</button>
          <button class="dp-preset" onclick="setPreset('custom',this)">Custom Range</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Funnel -->
  <div class="section-title">Conversion Funnel</div>
  <div class="funnel-card">
    <div class="funnel-svg-wrap">
      <svg class="funnel-svg" id="funnelSVG" viewBox="0 0 320 400" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="funnel-labels" id="funnelLabels">
        <div class="loading-msg">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Daily Trend Chart -->
  <div class="section-title">Daily Signal Volume</div>
  <div class="chart-card">
    <div class="chart-legend" id="chartLegend"></div>
    <div class="chart-wrap">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = "https://otzmitwvvetdzheogtkr.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90em1pdHd2dmV0ZHpoZW9ndGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNjAzNTUsImV4cCI6MjA5NjgzNjM1NX0.YQwCTN7cxq0Zo0e66_Kl2yAmN0okWyqpTq-ktgexlig";

  const RAILWAY_URL    = "https://terratern-capi-production.up.railway.app";
  const TRIGGER_SECRET = "TT-CAPI-2024"; // must match TRIGGER_SECRET in Railway Variables

  let trendChart = null;
  let dateRange  = { preset: "7d", from: null, to: null };

  const EVENT_COLORS = {
    WebinarBooked:    { bg: "rgba(0,33,92,0.15)",   border: "#00215c" },
    WebinarAttended:  { bg: "rgba(47,127,212,0.20)", border: "#2f7fd4" },
    PaymentScheduled: { bg: "rgba(22,163,74,0.15)",  border: "#16a34a" },
    Purchase:         { bg: "rgba(184,147,10,0.20)", border: "#b8930a" },
  };

  const FUNNEL_ORDER = ["WebinarBooked","WebinarAttended","PaymentScheduled","Purchase"];
  const FUNNEL_LABELS = {
    WebinarBooked:    "Webinar Booked",
    WebinarAttended:  "Webinar Attended",
    PaymentScheduled: "Payment Scheduled",
    Purchase:         "Purchase",
  };

  // ── Supabase helpers ──
  async function supabaseRPC(fn, params) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(params)
    });
    if (!res.ok) throw new Error(`RPC error: ${res.status}`);
    return res.json();
  }

  async function countFromSupabase(filter = "") {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/capi_events_log?select=id${filter}`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "count=exact",
        "Range": "0-0"
      }
    });
    if (!res.ok) throw new Error(`Count error: ${res.status}`);
    const range = res.headers.get("Content-Range") || "";
    const match = range.match(/\/(\d+)$/);
    return match ? parseInt(match[1], 10) : 0;
  }

  // getDateRange reads from dateRange state
  function getDateRange() {
    return { start: dateRange.from, end: dateRange.to };
  }

  // ── Date Picker Logic ──
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

  function setPreset(preset, btn) {
    const now = new Date();
    let from = null, to = null, label = "Last 7 Days";

    document.querySelectorAll(".dp-preset").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");


    if (preset === "7d")  { const s = new Date(now); s.setDate(s.getDate()-6); from=fmt(s); to=fmt(now); label="Last 7 Days"; }
    else if (preset === "14d") { const s = new Date(now); s.setDate(s.getDate()-13); from=fmt(s); to=fmt(now); label="Last 14 Days"; }
    else if (preset === "30d") { const s = new Date(now); s.setDate(s.getDate()-29); from=fmt(s); to=fmt(now); label="Last 30 Days"; }
    else if (preset === "60d") { const s = new Date(now); s.setDate(s.getDate()-59); from=fmt(s); to=fmt(now); label="Last 60 Days"; }
    else if (preset === "90d") { const s = new Date(now); s.setDate(s.getDate()-89); from=fmt(s); to=fmt(now); label="Last 90 Days"; }
    else if (preset === "thisMonth") {
      from = fmt(new Date(now.getFullYear(), now.getMonth(), 1));
      to   = fmt(now);
      label = now.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    } else if (preset === "lastMonth") {
      const lm  = new Date(now.getFullYear(), now.getMonth()-1, 1);
      const lme = new Date(now.getFullYear(), now.getMonth(), 0);
      from = fmt(lm); to = fmt(lme);
      label = lm.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    } else if (preset === "custom") {
      openCustomPicker();
      return;
    }

    dateRange = { preset, from, to };
    document.getElementById("datePickerLabel").textContent = label;
    closeDatePicker();
    loadAll();
  }

  function buildCustomLabel() {
    const { from, to } = dateRange;
    if (!from && !to) return "Custom Range";
    if (from && to && from === to) return from;
    if (from && to) return `${from} → ${to}`;
    if (from) return `From ${from}`;
    return `Until ${to}`;
  }


  function toggleDatePicker(e) {
    e.stopPropagation();
    const dd  = document.getElementById("datePickerDropdown");
    const btn = document.getElementById("datePickerBtn");
    const open = dd.style.display !== "none";
    dd.style.display = open ? "none" : "block";
    btn.classList.toggle("open", !open);
  }

  function closeDatePicker() {
    document.getElementById("datePickerDropdown").style.display = "none";
    document.getElementById("datePickerBtn").classList.remove("open");
  }

  document.addEventListener("click", e => {
    const wrap = document.getElementById("datePickerWrap");
    if (wrap && !wrap.contains(e.target)) closeDatePicker();
  });

  // ── Funnel ──
  async function loadFunnel() {
    const { start, end } = getDateRange();
    if (!start || !end) return;

    const mf = `&sent_at=gte.${encodeURIComponent(start + "T00:00:00+05:30")}&sent_at=lte.${encodeURIComponent(end + "T23:59:59+05:30")}`;

    const counts = await Promise.all(
      FUNNEL_ORDER.map(evt => {
        if (evt === "WebinarAttended") {
          return Promise.all([
            countFromSupabase(`&event_name=eq.WebinarAttended${mf}`),
            countFromSupabase(`&event_name=eq.CounsellingDone${mf}`)
          ]).then(([a, b]) => a + b);
        }
        return countFromSupabase(`&event_name=eq.${evt}${mf}`);
      })
    );

    drawFunnel(counts);
  }

  function drawFunnel(counts) {
    const svg       = document.getElementById("funnelSVG");
    const labelsDiv = document.getElementById("funnelLabels");
    const W = 320, H = 400;
    const n = counts.length;

    // Funnel trapezoid geometry — widths from 90% at top to 28% at bottom
    const topWidths    = [0.90, 0.70, 0.50, 0.28];
    const bottomWidths = [0.70, 0.50, 0.28, 0.14];
    const segH  = (H - 20) / n;
    const cx    = W / 2;

    const COLORS = {
      WebinarBooked:    { fill: "#c7d9f5", stroke: "#00215c", dark: "#00215c" },
      WebinarAttended:  { fill: "#b3d4f7", stroke: "#2f7fd4", dark: "#2f7fd4" },
      PaymentScheduled: { fill: "#bbf7d0", stroke: "#16a34a", dark: "#16a34a" },
      Purchase:         { fill: "#fef08a", stroke: "#b8930a", dark: "#b8930a" },
    };

    let svgHTML = `<defs>
      ${FUNNEL_ORDER.map((evt, i) => {
        const c = COLORS[evt];
        return `<linearGradient id="fg${i}" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="${c.stroke}" stop-opacity="0.7"/>
          <stop offset="50%" stop-color="${c.fill}"/>
          <stop offset="100%" stop-color="${c.stroke}" stop-opacity="0.7"/>
        </linearGradient>`;
      }).join('')}
    </defs>`;

    // Draw each trapezoid segment
    FUNNEL_ORDER.forEach((evt, i) => {
      const y0  = i * segH + 10;
      const y1  = (i + 1) * segH + 10;
      const tw  = topWidths[i] * W / 2;
      const bw  = bottomWidths[i] * W / 2;

      // Main trapezoid
      const x0L = cx - tw, x0R = cx + tw;
      const x1L = cx - bw, x1R = cx + bw;

      // Ellipse caps for 3D effect
      const ry = segH * 0.06;

      svgHTML += `
        <polygon points="${x0L},${y0} ${x0R},${y0} ${x1R},${y1} ${x1L},${y1}"
          fill="url(#fg${i})" stroke="${COLORS[evt].stroke}" stroke-width="1.5" opacity="0.92"/>
        <!-- top ellipse -->
        <ellipse cx="${cx}" cy="${y0}" rx="${tw}" ry="${ry}"
          fill="${COLORS[evt].stroke}" opacity="0.35"/>
        <!-- bottom ellipse -->
        <ellipse cx="${cx}" cy="${y1}" rx="${bw}" ry="${ry * (bw/tw)}"
          fill="${COLORS[evt].stroke}" opacity="0.25"/>
      `;
    });

    svg.innerHTML = svgHTML;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

    // Labels panel
    const maxCount = Math.max(...counts, 1);
    labelsDiv.innerHTML = FUNNEL_ORDER.map((evt, i) => {
      const count   = counts[i];
      const prev    = i > 0 ? counts[i-1] : null;
      const conv    = prev ? ((count / prev) * 100).toFixed(1) : null;
      const cls     = !conv ? "" : parseFloat(conv) >= 60 ? "good" : parseFloat(conv) >= 30 ? "warn" : "bad";
      const convTxt = conv ? `↓ ${conv}% from prev` : "top of funnel";
      const c       = COLORS[evt];
      return `
        <div class="funnel-label-row">
          <div class="funnel-label-line" style="background:${c.stroke}"></div>
          <div class="funnel-label-content">
            <div class="funnel-label-name" style="color:${c.dark}">${FUNNEL_LABELS[evt]}</div>
            <div class="funnel-label-count">${count.toLocaleString()}</div>
            <div class="funnel-label-conv ${cls}">${convTxt}</div>
          </div>
        </div>`;
    }).join('');
  }


  async function loadTrend() {
    const { start, end } = getDateRange();
    if (!start || !end) return;

    const rows = await supabaseRPC("get_daily_event_counts", {
      start_date: start,
      end_date:   end
    });

    // Build date axis
    const days = [];
    const cur  = new Date(start);
    const endD = new Date(end);
    while (cur <= endD) { days.push(fmt(cur)); cur.setDate(cur.getDate() + 1); }

    // Group by event
    const byEvent = {};
    FUNNEL_ORDER.forEach(e => { byEvent[e] = {}; days.forEach(d => { byEvent[e][d] = 0; }); });
    rows.forEach(r => {
      const evt = r.event_name;
      if (byEvent[evt] && byEvent[evt][r.day] !== undefined) {
        byEvent[evt][r.day] += parseInt(r.count, 10);
      }
    });

    // Chart labels — short date format
    const labels = days.map(d => {
      const dt = new Date(d + "T00:00:00");
      return dt.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
    });

    // Stacked bar datasets — funnel order bottom to top
    const datasets = FUNNEL_ORDER.map(evt => ({
      label:           FUNNEL_LABELS[evt],
      data:            days.map(d => byEvent[evt][d]),
      backgroundColor: EVENT_COLORS[evt].border,
      borderColor:     "transparent",
      borderWidth:     0,
      borderRadius:    2,
      stack:           "funnel",
    }));

    // Legend
    const legend = document.getElementById("chartLegend");
    legend.innerHTML = FUNNEL_ORDER.map(evt => `
      <div class="legend-item">
        <div class="legend-dot" style="background:${EVENT_COLORS[evt].border}"></div>
        ${FUNNEL_LABELS[evt]}
      </div>`).join("");

    if (trendChart) { trendChart.destroy(); trendChart = null; }

    const ctx = document.getElementById("trendChart").getContext("2d");
    trendChart = new Chart(ctx, {
      type: "bar",
      data: { labels, datasets },
      options: {
        responsive:          true,
        maintainAspectRatio: false,
        interaction:         { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: "#fff",
            titleColor:      "#0a0a0a",
            bodyColor:       "#5b6b80",
            borderColor:     "#d6e3f5",
            borderWidth:     1,
            padding:         10,
            callbacks: {
              label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()}`
            }
          }
        },
        scales: {
          x: {
            stacked: true,
            grid:    { display: false },
            ticks:   { color: "#5b6b80", font: { size: 11 }, maxRotation: 45 }
          },
          y: {
            stacked: true,
            grid:    { color: "rgba(214,227,245,0.5)" },
            ticks:   { color: "#5b6b80", font: { size: 11 }, precision: 0 },
            beginAtZero: true
          }
        }
      }
    });
  }

  // ── Manual Trigger ──
  async function manualTrigger() {
    if (!RAILWAY_URL) {
      showToast("Set RAILWAY_URL in this file first", "error");
      return;
    }
    if (!TRIGGER_SECRET) {
      showToast("Set TRIGGER_SECRET in this file first", "error");
      return;
    }

    const btn = document.getElementById("triggerBtn");
    const status = document.getElementById("triggerStatus");
    btn.disabled = true;
    btn.classList.add("running");
    btn.textContent = "⏳ Running...";
    status.textContent = "Pipeline triggered...";

    try {
      const res = await fetch(`${RAILWAY_URL}/trigger`, {
        method: "POST",
        headers: {
          "Content-Type":    "application/json",
          "x-trigger-secret": TRIGGER_SECRET
        }
      });

      if (res.status === 409) {
        showToast("Pipeline already running — try again shortly", "info");
        status.textContent = "Already running";
      } else if (res.status === 401) {
        showToast("Trigger secret incorrect", "error");
        status.textContent = "Auth failed";
      } else if (res.ok) {
        showToast("Pipeline triggered successfully ✓", "success");
        status.textContent = `Last triggered: ${new Date().toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata" })}`;
        // Reload analytics after 15s to pick up new events
        setTimeout(loadAll, 15000);
      } else {
        showToast("Trigger failed — check Railway logs", "error");
        status.textContent = "Failed";
      }
    } catch (err) {
      showToast("Could not reach Railway service", "error");
      status.textContent = "Network error";
    }

    btn.disabled = false;
    btn.classList.remove("running");
    btn.textContent = "▶ Run Pipeline Now";
  }

  // ── Toast ──
  function showToast(msg, type = "info") {
    const t = document.getElementById("toast");
    t.textContent  = msg;
    t.className    = `toast show ${type}`;
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  // ── Init ──
  async function loadAll() {
    await Promise.all([loadFunnel(), loadTrend()]);
  }

  loadAll();





  // ── Custom Range Picker ──
  let _cpCallback = null;

  function openCustomPicker() {
    closeDatePicker();
    // Pre-fill with existing custom range if any
    const f = document.getElementById("cpFrom");
    const t = document.getElementById("cpTo");
    if (dateRange && dateRange.preset === "custom") {
      f.value = dateRange.from || "";
      t.value = dateRange.to   || "";
    } else {
      f.value = ""; t.value = "";
    }
    cpValidate();
    document.getElementById("cpOverlay").style.display = "flex";
  }

  function cpClose() {
    document.getElementById("cpOverlay").style.display = "none";
  }

  function cpOverlayClick(e) {
    if (e.target === document.getElementById("cpOverlay")) cpClose();
  }

  function cpValidate() {
    const f = document.getElementById("cpFrom").value;
    const t = document.getElementById("cpTo").value;
    document.getElementById("cpApply").disabled = !(f && t && f <= t);
  }

  function cpApply() {
    const from  = document.getElementById("cpFrom").value;
    const to    = document.getElementById("cpTo").value;
    if (!from || !to) return;
    cpClose();
    const label = from === to ? from : `${from} → ${to}`;
    dateRange = { preset: "custom", from, to };
    document.getElementById("datePickerLabel").textContent = label;
    // mark Custom Range as active in dropdown
    document.querySelectorAll(".dp-preset").forEach(b => {
      b.classList.toggle("active", b.textContent.trim() === "Custom Range");
    });
    // trigger the right reload function
    if (typeof applyFilters === "function") applyFilters();
    else if (typeof loadAll === "function") loadAll();
  }

</script>



<!-- Custom Range Picker -->
<div class="custom-picker-overlay" id="cpOverlay" style="display:none;" onclick="cpOverlayClick(event)">
  <div class="custom-picker-box" onclick="event.stopPropagation()">
    <div class="custom-picker-title">Select Date Range</div>
    <div class="custom-picker-fields">
      <div class="custom-picker-field">
        <label>From</label>
        <input type="date" id="cpFrom" oninput="cpValidate()">
      </div>
      <div class="custom-picker-field">
        <label>To</label>
        <input type="date" id="cpTo" oninput="cpValidate()">
      </div>
    </div>
    <div class="custom-picker-footer">
      <button class="cp-btn cp-btn-cancel" onclick="cpClose()">Cancel</button>
      <button class="cp-btn cp-btn-apply" id="cpApply" onclick="cpApply()" disabled>Apply</button>
    </div>
  </div>
</div>
