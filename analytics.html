<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraTern CAPI — Analytics</title>
<link rel="icon" href="https://terratern.com/images/favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #eaf2fc;
    --surface: #ffffff;
    --surface-deep: #dfeaf9;
    --border: #d6e3f5;
    --text: #0a0a0a;
    --text-muted: #5b6b80;
    --text-dim: #8da3bc;
    --accent: #255cc1;
    --accent-glow: rgba(37,92,193,0.10);
    --navy: #00215c;
    --sky: #2f7fd4;
    --gold: #b8930a;
    --green: #16a34a;
    --red: #dc2626;
    --red-bg: rgba(220,38,38,0.08);
    --mono: 'JetBrains Mono', monospace;
    --shadow: 0 1px 3px rgba(0,33,92,0.08), 0 1px 2px rgba(0,33,92,0.05);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── Header ── */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--surface);
    box-shadow: var(--shadow);
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .logo-img { height: 26px; width: auto; }

  .logo-dot {
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--gold);
    animation: pulse 2s infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .logo-text { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; }
  .logo-sub  { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

  .header-right { display: flex; align-items: center; gap: 8px; }

  .nav-link {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.15s;
  }

  .nav-link:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Trigger Button ── */
  .trigger-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }

  .trigger-btn:hover { background: var(--navy); }
  .trigger-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .trigger-btn.running { background: var(--gold); color: #000; }

  .trigger-status {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--text-muted);
    min-width: 120px;
    text-align: right;
  }

  /* ── Layout ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Date Range ── */
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }

  /* ── Date Picker ── */
  .date-picker-wrap { position: relative; }

  .date-picker-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12px;
    font-family: var(--mono);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    min-width: 130px;
    justify-content: space-between;
  }

  .date-picker-btn:hover, .date-picker-btn.open {
    border-color: var(--accent);
    color: var(--accent);
  }

  .dp-arrow { font-size: 10px; opacity: 0.6; }

  .date-picker-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,33,92,0.12);
    z-index: 200;
    min-width: 180px;
    overflow: hidden;
  }

  .dp-presets { display: flex; flex-direction: column; padding: 6px; gap: 2px; }

  .dp-preset {
    padding: 7px 12px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    text-align: left;
    border-radius: 6px;
    transition: all 0.1s;
    font-weight: 500;
  }

  .dp-preset:hover { background: var(--bg); color: var(--text); }
  .dp-preset.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }



  /* ── Funnel ── */
  .funnel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }

  .funnel-stages { display: flex; flex-direction: column; gap: 10px; }

  .funnel-stage {
    display: grid;
    grid-template-columns: 160px 1fr 80px 80px;
    align-items: center;
    gap: 12px;
  }

  .funnel-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .funnel-bar-wrap {
    background: var(--bg);
    border-radius: 4px;
    height: 28px;
    overflow: hidden;
    position: relative;
  }

  .funnel-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
    display: flex;
    align-items: center;
    padding-left: 10px;
    min-width: 2px;
  }

  .funnel-count {
    font-size: 15px;
    font-weight: 700;
    font-family: var(--mono);
    color: var(--navy);
    text-align: right;
  }

  .funnel-drop {
    font-size: 11px;
    font-family: var(--mono);
    text-align: right;
  }

  .funnel-drop.good  { color: var(--green); }
  .funnel-drop.warn  { color: var(--gold); }
  .funnel-drop.bad   { color: var(--red); }

  .funnel-connector {
    display: flex;
    align-items: center;
    padding-left: 160px;
    gap: 12px;
    margin: 2px 0;
  }

  .funnel-connector-line {
    width: 2px;
    height: 10px;
    background: var(--border);
    margin-left: 12px;
  }

  .funnel-conversion {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  /* ── Trend Chart ── */
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }

  .chart-wrap {
    position: relative;
    height: 320px;
  }

  .chart-legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
  }

  /* ── Loading / Empty ── */
  .loading-msg {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    transform: translateY(60px);
    opacity: 0;
    transition: all 0.25s;
    z-index: 999;
    color: #fff;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--green); }
  .toast.error   { background: var(--red); }
  .toast.info    { background: var(--accent); }

  @media (max-width: 768px) {
    .container { padding: 16px; }
    .funnel-stage { grid-template-columns: 120px 1fr 60px 60px; }
    .chart-wrap { height: 220px; }
    .header { padding: 0 16px; }
  }

  /* ── Calendar Picker ── */
  .cal-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,33,92,0.18);
    display: flex;
    overflow: hidden;
    min-width: 660px;
    max-width: 95vw;
    font-family: "Inter", sans-serif;
  }

  .cal-presets {
    width: 160px;
    border-right: 1px solid var(--border);
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--surface);
  }

  .cal-preset-btn {
    padding: 8px 12px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-family: "Inter", sans-serif;
    cursor: pointer;
    text-align: left;
    border-radius: 6px;
    transition: all 0.1s;
    font-weight: 500;
  }

  .cal-preset-btn:hover { background: var(--bg); color: var(--text); }
  .cal-preset-btn.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }

  .cal-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }

  .cal-months {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
  }

  .cal-month {
    flex: 1;
    min-width: 200px;
  }

  .cal-month-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .cal-month-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
  }

  .cal-nav {
    width: 26px;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: all 0.1s;
  }

  .cal-nav:hover { border-color: var(--accent); color: var(--accent); }
  .cal-nav.invisible { visibility: hidden; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .cal-dow {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    text-align: center;
    padding: 4px 0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .cal-day {
    font-size: 12px;
    text-align: center;
    padding: 6px 4px;
    border-radius: 5px;
    cursor: pointer;
    color: var(--text);
    transition: all 0.1s;
    font-weight: 500;
    border: 1px solid transparent;
  }

  .cal-day:hover:not(.cal-empty):not(.cal-disabled) {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent);
  }

  .cal-day.cal-empty { cursor: default; }
  .cal-day.cal-disabled { color: var(--text-dim); cursor: default; }

  .cal-day.cal-selected-start,
  .cal-day.cal-selected-end {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    border-color: var(--accent);
  }

  .cal-day.cal-in-range {
    background: var(--accent-glow);
    color: var(--accent);
    border-radius: 0;
  }

  .cal-day.cal-today {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }

  .cal-day.cal-today.cal-selected-start,
  .cal-day.cal-today.cal-selected-end {
    color: #fff;
  }

  .cal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 4px;
  }

  .cal-range-label {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent);
    font-weight: 600;
  }

  .cal-btns { display: flex; gap: 8px; }

  .cal-btn {
    padding: 6px 18px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: "Inter", sans-serif;
    transition: all 0.15s;
  }

  .cal-btn-cancel {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
  }

  .cal-btn-cancel:hover { border-color: var(--red); color: var(--red); }

  .cal-btn-apply {
    border: none;
    background: var(--accent);
    color: #fff;
  }

  .cal-btn-apply:hover { background: var(--navy); }
  .cal-btn-apply:disabled { opacity: 0.4; cursor: not-allowed; }

  @media (max-width: 680px) {
    .cal-box { flex-direction: column; min-width: unset; width: 95vw; }
    .cal-presets { width: 100%; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border); }
    .cal-months { flex-direction: column; gap: 16px; }
  }

</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="https://terratern.com/images/logo.svg" alt="TerraTern" class="logo-img">
    <div class="logo-dot"></div>
    <div>
      <div class="logo-text">CAPI · Analytics</div>
      <div class="logo-sub">Funnel &amp; Trends</div>
    </div>
  </div>
  <div class="header-right">
    <span class="trigger-status" id="triggerStatus"></span>
    <button class="trigger-btn" id="triggerBtn" onclick="manualTrigger()">
      ▶ Run Pipeline Now
    </button>
    <a class="nav-link" href="index.html">← Event Logs</a>
  </div>
</div>

<div class="container">

  <!-- Date picker -->
  <div class="controls">
    <div class="date-picker-wrap" id="datePickerWrap">
      <button class="date-picker-btn" id="datePickerBtn" onclick="toggleDatePicker(event)">
        <span id="datePickerLabel">Last 7 Days</span>
        <span class="dp-arrow">▾</span>
      </button>
      <div class="date-picker-dropdown" id="datePickerDropdown" style="display:none;">
        <div class="dp-presets">
          <button class="dp-preset" onclick="setPreset('7d',this)">Last 7 Days</button>
          <button class="dp-preset" onclick="setPreset('14d',this)">Last 14 Days</button>
          <button class="dp-preset" onclick="setPreset('30d',this)">Last 30 Days</button>
          <button class="dp-preset" onclick="setPreset('thisMonth',this)">This Month</button>
          <button class="dp-preset" onclick="setPreset('lastMonth',this)">Last Month</button>
          <button class="dp-preset" onclick="setPreset('60d',this)">Last 60 Days</button>
          <button class="dp-preset" onclick="setPreset('90d',this)">Last 90 Days</button>
          <button class="dp-preset" onclick="setPreset('custom',this)">Custom Range</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Funnel -->
  <div class="section-title">Conversion Funnel</div>
  <div class="funnel-card">
    <div class="funnel-stages" id="funnelStages">
      <div class="loading-msg">Loading funnel data...</div>
    </div>
  </div>

  <!-- Daily Trend Chart -->
  <div class="section-title">Daily Signal Volume</div>
  <div class="chart-card">
    <div class="chart-legend" id="chartLegend"></div>
    <div class="chart-wrap">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = "https://otzmitwvvetdzheogtkr.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90em1pdHd2dmV0ZHpoZW9ndGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNjAzNTUsImV4cCI6MjA5NjgzNjM1NX0.YQwCTN7cxq0Zo0e66_Kl2yAmN0okWyqpTq-ktgexlig";

  const RAILWAY_URL    = "https://terratern-capi-production.up.railway.app";
  const TRIGGER_SECRET = "TT-CAPI-2024"; // must match TRIGGER_SECRET in Railway Variables

  let trendChart = null;
  let dateRange  = { preset: "7d", from: null, to: null };

  const EVENT_COLORS = {
    WebinarBooked:    { bg: "rgba(0,33,92,0.15)",   border: "#00215c" },
    WebinarAttended:  { bg: "rgba(47,127,212,0.20)", border: "#2f7fd4" },
    PaymentScheduled: { bg: "rgba(22,163,74,0.15)",  border: "#16a34a" },
    Purchase:         { bg: "rgba(184,147,10,0.20)", border: "#b8930a" },
  };

  const FUNNEL_ORDER = ["WebinarBooked","WebinarAttended","PaymentScheduled","Purchase"];
  const FUNNEL_LABELS = {
    WebinarBooked:    "Webinar Booked",
    WebinarAttended:  "Webinar Attended",
    PaymentScheduled: "Payment Scheduled",
    Purchase:         "Purchase",
  };

  // ── Supabase helpers ──
  async function supabaseRPC(fn, params) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(params)
    });
    if (!res.ok) throw new Error(`RPC error: ${res.status}`);
    return res.json();
  }

  async function countFromSupabase(filter = "") {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/capi_events_log?select=id${filter}`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "count=exact",
        "Range": "0-0"
      }
    });
    if (!res.ok) throw new Error(`Count error: ${res.status}`);
    const range = res.headers.get("Content-Range") || "";
    const match = range.match(/\/(\d+)$/);
    return match ? parseInt(match[1], 10) : 0;
  }

  // getDateRange reads from dateRange state
  function getDateRange() {
    return { start: dateRange.from, end: dateRange.to };
  }

  // ── Date Picker Logic ──
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

  function setPreset(preset, btn) {
    const now = new Date();
    let from = null, to = null, label = "Last 7 Days";

    document.querySelectorAll(".dp-preset").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    const custom = document.getElementById("dpCustom");
    custom.style.display = preset === "custom" ? "flex" : "none";

    if (preset === "7d")  { const s = new Date(now); s.setDate(s.getDate()-6); from=fmt(s); to=fmt(now); label="Last 7 Days"; }
    else if (preset === "14d") { const s = new Date(now); s.setDate(s.getDate()-13); from=fmt(s); to=fmt(now); label="Last 14 Days"; }
    else if (preset === "30d") { const s = new Date(now); s.setDate(s.getDate()-29); from=fmt(s); to=fmt(now); label="Last 30 Days"; }
    else if (preset === "60d") { const s = new Date(now); s.setDate(s.getDate()-59); from=fmt(s); to=fmt(now); label="Last 60 Days"; }
    else if (preset === "90d") { const s = new Date(now); s.setDate(s.getDate()-89); from=fmt(s); to=fmt(now); label="Last 90 Days"; }
    else if (preset === "thisMonth") {
      from = fmt(new Date(now.getFullYear(), now.getMonth(), 1));
      to   = fmt(now);
      label = now.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    } else if (preset === "lastMonth") {
      const lm  = new Date(now.getFullYear(), now.getMonth()-1, 1);
      const lme = new Date(now.getFullYear(), now.getMonth(), 0);
      from = fmt(lm); to = fmt(lme);
      label = lm.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    } else if (preset === "custom") {
      calOpen(
        (from, to, lbl) => {
          dateRange = { preset: "custom", from, to };
          document.getElementById("datePickerLabel").textContent = lbl;
          loadAll();
        },
        dateRange.from,
        dateRange.to
      );
      return;
    }

    dateRange = { preset, from, to };
    document.getElementById("datePickerLabel").textContent = label;
    closeDatePicker();
    // Mark first preset active
  document.querySelector('.dp-preset').classList.add('active');
  loadAll();
  }

  function buildCustomLabel() {
    const { from, to } = dateRange;
    if (!from && !to) return "Custom Range";
    if (from && to && from === to) return from;
    if (from && to) return `${from} → ${to}`;
    if (from) return `From ${from}`;
    return `Until ${to}`;
  }

  // onCustomDate removed — handled by calOpen

  function toggleDatePicker(e) {
    e.stopPropagation();
    const dd  = document.getElementById("datePickerDropdown");
    const btn = document.getElementById("datePickerBtn");
    const open = dd.style.display !== "none";
    dd.style.display = open ? "none" : "block";
    btn.classList.toggle("open", !open);
  }

  function closeDatePicker() {
    document.getElementById("datePickerDropdown").style.display = "none";
    document.getElementById("datePickerBtn").classList.remove("open");
  }

  document.addEventListener("click", e => {
    const wrap = document.getElementById("datePickerWrap");
    if (wrap && !wrap.contains(e.target)) closeDatePicker();
  });

  // ── Funnel ──
  async function loadFunnel() {
    const { start, end } = getDateRange();
    const mf = `&sent_at=gte.${encodeURIComponent(start + "T00:00:00+05:30")}&sent_at=lte.${encodeURIComponent(end + "T23:59:59+05:30")}`;

    const counts = await Promise.all(
      FUNNEL_ORDER.map(evt => {
        if (evt === "WebinarAttended") {
          // merge CounsellingDone
          return Promise.all([
            countFromSupabase(`&event_name=eq.WebinarAttended${mf}`),
            countFromSupabase(`&event_name=eq.CounsellingDone${mf}`)
          ]).then(([a, b]) => a + b);
        }
        return countFromSupabase(`&event_name=eq.${evt}${mf}`);
      })
    );

    const maxCount = Math.max(...counts, 1);
    const container = document.getElementById("funnelStages");
    container.innerHTML = "";

    FUNNEL_ORDER.forEach((evt, i) => {
      const count    = counts[i];
      const pct      = Math.round((count / maxCount) * 100);
      const color    = EVENT_COLORS[evt];
      const prevCount = i > 0 ? counts[i - 1] : null;
      const convRate  = prevCount ? ((count / prevCount) * 100).toFixed(1) : null;

      // Connector between stages
      if (i > 0 && prevCount !== null) {
        const rate  = parseFloat(convRate);
        const cls   = rate >= 60 ? "good" : rate >= 30 ? "warn" : "bad";
        const arrow = document.createElement("div");
        arrow.className = "funnel-connector";
        arrow.innerHTML = `
          <div class="funnel-connector-line"></div>
          <span class="funnel-conversion ${cls}">↓ ${convRate}% conversion from ${FUNNEL_LABELS[FUNNEL_ORDER[i-1]]}</span>`;
        container.appendChild(arrow);
      }

      const stage = document.createElement("div");
      stage.className = "funnel-stage";

      const dropLabel = i === 0
        ? `<span class="funnel-drop" style="color:var(--text-dim)">top</span>`
        : (() => {
            const rate = parseFloat(convRate);
            const cls  = rate >= 60 ? "good" : rate >= 30 ? "warn" : "bad";
            const drop = prevCount > 0 ? (100 - rate).toFixed(1) : "—";
            return `<span class="funnel-drop ${cls}">-${drop}%</span>`;
          })();

      stage.innerHTML = `
        <div class="funnel-label">${FUNNEL_LABELS[evt]}</div>
        <div class="funnel-bar-wrap">
          <div class="funnel-bar" style="width:${pct}%;background:${color.border};opacity:0.85"></div>
        </div>
        <div class="funnel-count">${count.toLocaleString()}</div>
        ${dropLabel}`;
      container.appendChild(stage);
    });
  }

  // ── Trend Chart ──
  async function loadTrend() {
    const { start, end } = getDateRange();
    if (!start || !end) return;

    const rows = await supabaseRPC("get_daily_event_counts", {
      start_date: start,
      end_date:   end
    });

    // Build date axis
    const days = [];
    const cur  = new Date(start);
    const endD = new Date(end);
    while (cur <= endD) { days.push(fmt(cur)); cur.setDate(cur.getDate() + 1); }

    // Group by event
    const byEvent = {};
    FUNNEL_ORDER.forEach(e => { byEvent[e] = {}; days.forEach(d => { byEvent[e][d] = 0; }); });
    rows.forEach(r => {
      const evt = r.event_name;
      if (byEvent[evt] && byEvent[evt][r.day] !== undefined) {
        byEvent[evt][r.day] += parseInt(r.count, 10);
      }
    });

    // Chart labels — short date format
    const labels = days.map(d => {
      const dt = new Date(d + "T00:00:00");
      return dt.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
    });

    // Stacked bar datasets — funnel order bottom to top
    const datasets = FUNNEL_ORDER.map(evt => ({
      label:           FUNNEL_LABELS[evt],
      data:            days.map(d => byEvent[evt][d]),
      backgroundColor: EVENT_COLORS[evt].border,
      borderColor:     "transparent",
      borderWidth:     0,
      borderRadius:    2,
      stack:           "funnel",
    }));

    // Legend
    const legend = document.getElementById("chartLegend");
    legend.innerHTML = FUNNEL_ORDER.map(evt => `
      <div class="legend-item">
        <div class="legend-dot" style="background:${EVENT_COLORS[evt].border}"></div>
        ${FUNNEL_LABELS[evt]}
      </div>`).join("");

    if (trendChart) { trendChart.destroy(); trendChart = null; }

    const ctx = document.getElementById("trendChart").getContext("2d");
    trendChart = new Chart(ctx, {
      type: "bar",
      data: { labels, datasets },
      options: {
        responsive:          true,
        maintainAspectRatio: false,
        interaction:         { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: "#fff",
            titleColor:      "#0a0a0a",
            bodyColor:       "#5b6b80",
            borderColor:     "#d6e3f5",
            borderWidth:     1,
            padding:         10,
            callbacks: {
              label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()}`
            }
          }
        },
        scales: {
          x: {
            stacked: true,
            grid:    { display: false },
            ticks:   { color: "#5b6b80", font: { size: 11 }, maxRotation: 45 }
          },
          y: {
            stacked: true,
            grid:    { color: "rgba(214,227,245,0.5)" },
            ticks:   { color: "#5b6b80", font: { size: 11 }, precision: 0 },
            beginAtZero: true
          }
        }
      }
    });
  }

  // ── Manual Trigger ──
  async function manualTrigger() {
    if (!RAILWAY_URL) {
      showToast("Set RAILWAY_URL in this file first", "error");
      return;
    }
    if (!TRIGGER_SECRET) {
      showToast("Set TRIGGER_SECRET in this file first", "error");
      return;
    }

    const btn = document.getElementById("triggerBtn");
    const status = document.getElementById("triggerStatus");
    btn.disabled = true;
    btn.classList.add("running");
    btn.textContent = "⏳ Running...";
    status.textContent = "Pipeline triggered...";

    try {
      const res = await fetch(`${RAILWAY_URL}/trigger`, {
        method: "POST",
        headers: {
          "Content-Type":    "application/json",
          "x-trigger-secret": TRIGGER_SECRET
        }
      });

      if (res.status === 409) {
        showToast("Pipeline already running — try again shortly", "info");
        status.textContent = "Already running";
      } else if (res.status === 401) {
        showToast("Trigger secret incorrect", "error");
        status.textContent = "Auth failed";
      } else if (res.ok) {
        showToast("Pipeline triggered successfully ✓", "success");
        status.textContent = `Last triggered: ${new Date().toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata" })}`;
        // Reload analytics after 15s to pick up new events
        setTimeout(loadAll, 15000);
      } else {
        showToast("Trigger failed — check Railway logs", "error");
        status.textContent = "Failed";
      }
    } catch (err) {
      showToast("Could not reach Railway service", "error");
      status.textContent = "Network error";
    }

    btn.disabled = false;
    btn.classList.remove("running");
    btn.textContent = "▶ Run Pipeline Now";
  }

  // ── Toast ──
  function showToast(msg, type = "info") {
    const t = document.getElementById("toast");
    t.textContent  = msg;
    t.className    = `toast show ${type}`;
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  // ── Init ──
  async function loadAll() {
    await Promise.all([loadFunnel(), loadTrend()]);
  }

  loadAll();
</script>
